<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Page Not Found | MAYNA</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>
        .not-found {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }

        .not-found-content {
            max-width: 600px;
        }

        .not-found-code {
            font-size: clamp(80px, 18vw, 160px);
            line-height: 1;
            margin: 0;
        }

        .not-found h1 {
            margin: 20px 0 10px;
        }

        .not-found p {
            margin-bottom: 30px;
        }

        .not-found-home {
            display: inline-block;
            padding: 14px 24px;
            border-radius: 8px;
            text-decoration: none;
            background: #111;
            color: #fff;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <main class="not-found">

        <div class="not-found-content">

            <div class="not-found-code">
                404
            </div>

            <h1>Page not found</h1>

            <p>
                The page you're looking for doesn't exist
                or may have been moved.
            </p>

            <a
                href="/"
                class="not-found-home"
            >
                Back to MAYNA
            </a>

        </div>

    </main>

</body>

</html>
