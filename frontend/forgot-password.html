<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MAYNA - Forgot Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            background: #dcfce7;
            color: #166534;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="card">

    <h1>Forgot Password?</h1>

    <p>
        Enter the email address you used when
        registering your business.
    </p>


    <form id="forgotForm">

        <label for="email">
            Owner Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
        >


        <button
            type="submit"
            id="submitButton"
        >
            Generate Reset Link
        </button>

    </form>


    <div id="message"></div>


    <a
        href="owner-login.html"
        class="back"
    >
        ← Back to Owner Login
    </a>

</div>


<script>

document
    .getElementById("forgotForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const button =
                document
                    .getElementById(
                        "submitButton"
                    );


            const message =
                document
                    .getElementById(
                        "message"
                    );


            button.disabled =
                true;

            button.textContent =
                "Processing...";


            try {

                const response =
                    await fetch(
                        "/api/businesses/forgot-password",
                        {

                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    email:
                                        email
                                })
                        }
                    );


                const result =
                    await response.json();


                message.textContent =
                    result.message ||
                    "If an account exists, a reset link has been generated.";

                message.style.display =
                    "block";


            } catch (error) {

                console.error(
                    "FORGOT PASSWORD ERROR:",
                    error
                );

                message.textContent =
                    "Could not process your request.";

                message.style.display =
                    "block";

            } finally {

                button.disabled =
                    false;

                button.textContent =
                    "Generate Reset Link";
            }

        }
    );

</script>


</body>

</html>
