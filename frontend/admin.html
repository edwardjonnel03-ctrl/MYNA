<body>

```
<main class="admin-page">

    <div class="admin-header">

        <div class="admin-header-top">

            <div>

                <h1>
                    MAYNA Admin Dashboard
                </h1>

                <p>
                    Manage registered businesses and verification status.
                </p>

            </div>

            <button
                id="logoutButton"
                class="logout-button"
            >
                Logout
            </button>

        </div>

    </div>


    <section class="admin-stats">

        <div class="stat-card">

            <span>
                Total Businesses
            </span>

            <strong id="totalBusinesses">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Verified Businesses
            </span>

            <strong id="verifiedBusinesses">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Unverified Businesses
            </span>

            <strong id="unverifiedBusinesses">
                0
            </strong>

        </div>

    </section>


    <section>

        <h2>
            Registered Businesses
        </h2>

        <div
            id="businessList"
            class="business-list"
        >
            Checking admin access...
        </div>

    </section>

</main>


<script>

    // =========================================
    // CHECK BACKEND ADMIN SESSION
    // =========================================

    async function checkAdminSession() {

        try {

            const response =
                await fetch(
                    "/api/admin/check",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );


            if (!response.ok) {

                window.location.href =
                    "admin-login.html";

                return false;
            }


            const result =
                await response.json();


            if (
                !result.success ||
                result.authenticated !== true
            ) {

                window.location.href =
                    "admin-login.html";

                return false;
            }


            return true;


        } catch (error) {

            console.error(
                "ADMIN SESSION CHECK ERROR:",
                error
            );

            window.location.href =
                "admin-login.html";

            return false;
        }

    }


    // =========================================
    // LOGOUT
    // =========================================

    async function logout() {

        try {

            const response =
                await fetch(
                    "/api/admin/logout",
                    {
                        method: "POST",
                        credentials: "include"
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Logout failed."
                );
            }


            sessionStorage.removeItem(
                "maynaAdmin"
            );


            window.location.href =
                "admin-login.html";


        } catch (error) {

            console.error(
                "LOGOUT ERROR:",
                error
            );

            alert(
                "Could not log out. Please try again."
            );

        }

    }


    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            logout
        );


    // =========================================
    // VERIFY / UNVERIFY BUSINESS
    // =========================================

    async function toggleVerification(
        id,
        currentStatus
    ) {

        const newStatus =
            !currentStatus;


        const action =
            newStatus
                ? "verify"
                : "unverify";


        const confirmed =
            confirm(
                `Are you sure you want to ${action} this business?`
            );


        if (!confirmed) {

            return;
        }


        try {

            const response =
                await fetch(
                    `/api/businesses/${id}/verification`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({
                                verified:
                                    newStatus
                            })
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                if (
                    response.status === 401
                ) {

                    window.location.href =
                        "admin-login.html";

                    return;
                }


                throw new Error(
                    result.message ||
                    "Verification update failed."
                );
            }


            alert(
                result.message
            );


            loadBusinesses();


        } catch (error) {

            console.error(
                error
            );


            alert(
                error.message ||
                "Could not update verification status."
            );

        }

    }

// =========================================
// DELETE BUSINESS
// =========================================

async function deleteBusiness(
    id,
    businessName
) {

    const confirmed =
        confirm(
            `Permanently delete "${businessName}"?\n\nThis cannot be undone.`
        );


    if (!confirmed) {

        return;
    }


    try {

        const response =
            await fetch(
                `/api/businesses/${id}`,
                {
                    method:
                        "DELETE",

                    credentials:
                        "include"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            if (
                response.status === 401
            ) {

                window.location.href =
                    "admin-login.html";

                return;
            }


            throw new Error(
                result.message ||
                "Could not delete business."
            );
        }


        alert(
            result.message
        );


        loadBusinesses();


    } catch (error) {

        console.error(
            "DELETE BUSINESS ERROR:",
            error
        );


        alert(
            error.message ||
            "Could not delete business."
        );
    }

}
    // =========================================
    // LOAD BUSINESSES
    // =========================================

    function escapeHTML(value) {

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        function (character) {

            const characters = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            };

            return characters[character];
        }
    );
}
    async function loadBusinesses() {

        const businessList =
            document.getElementById(
                "businessList"
            );


        try {

            const response =
                await fetch(
                    "/api/businesses",
                    {
                        credentials:
                            "include"
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    "Could not load businesses."
                );
            }


            if (!result.success) {

                throw new Error(
                    "Could not load businesses."
                );
            }


            const businesses =
                result.businesses;


            const verified =
                businesses.filter(
                    business =>
                        business.verified === true
                );


            const unverified =
                businesses.filter(
                    business =>
                        business.verified !== true
                );


            document.getElementById(
                "totalBusinesses"
            ).textContent =
                businesses.length;


            document.getElementById(
                "verifiedBusinesses"
            ).textContent =
                verified.length;


            document.getElementById(
                "unverifiedBusinesses"
            ).textContent =
                unverified.length;


            if (
                businesses.length === 0
            ) {

                businessList.innerHTML = `

                    <div class="business-card">

                        No businesses registered yet.

                    </div>

                `;

                return;
            }


            businessList.innerHTML =
                businesses.map(
                    business => {

                        const status =
                            business.verified

                            ? `

                                <div class="verified-status">

                                    ✓ Verified

                                </div>

                            `

                            : `

                                <div class="unverified-status">

                                    ○ Not Verified

                                </div>

                            `;

const businessName =
    escapeHTML(
        business.businessName ||
        "Unnamed Business"
    );

const category =
    escapeHTML(
        business.category ||
        "Not specified"
    );

const town =
    escapeHTML(
        business.town ||
        "Not specified"
    );
    
    const businessId =
    encodeURIComponent(
        String(
            business.id ?? ""
        )
    );
                        return `

                            <div class="business-card">

                                <div class="business-info">

                                    <h3>

                                        ${businessName}

                                    </h3>


                                    <p>

                                        Category:
                                        ${category}
                                        

                                    </p>


                                    <p>

                                        Location:
                                        ${town}

                                    </p>


                                    ${status}

                                </div>


                                <div class="admin-actions">

    <button
        class="admin-button verification-button"
        data-business-id="${businessId}"
        data-verified="${business.verified}"
    >

        ${
            business.verified
                ? "Unverify"
                : "Verify"
        }

    </button>


    <button
        class="delete-button"
        data-business-id="${businessId}"
        data-business-name="${businessName}"
    >
        Delete
    </button>

</div>

</div>

                        `;
                    }
                ).join("");
       businessList
    .querySelectorAll(
        ".verification-button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const id =
                        decodeURIComponent(
                            button.dataset.businessId
                        );

                    const currentStatus =
                        button.dataset.verified ===
                        "true";

                    toggleVerification(
                        id,
                        currentStatus
                    );
                }
            );
        }
    );  
       businessList
    .querySelectorAll(
        ".delete-button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    const id =
                        decodeURIComponent(
                            button.dataset.businessId
                        );

                    const businessName =
                        button.dataset.businessName ||
                        "this business";

                    deleteBusiness(
                        id,
                        businessName
                    );
                }
            );
        }
    );    


        } catch (error) {

            console.error(
                error
            );


            businessList.innerHTML = `

                <div class="business-card">

                    Unable to load businesses.

                </div>

            `;

        }

    }


    // =========================================
    // START ADMIN DASHBOARD
    // =========================================

    async function startAdminDashboard() {

        const authenticated =
            await checkAdminSession();


        if (!authenticated) {

            return;
        }


        await loadBusinesses();

    }


    startAdminDashboard();

</script>
