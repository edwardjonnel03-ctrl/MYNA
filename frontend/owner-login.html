<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Business Owner Login — MAYNA</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

    .forgot-password {
        display: inline-block;
        margin-top: 8px;
        color: #2563eb;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .forgot-password:hover {
        color: #1d4ed8;
        text-decoration: underline;
        transform: translateX(3px);
    }


/* MAYNA OWNER LOGIN MODAL */
.mayna-login-modal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
    z-index: 9999;
}

.mayna-login-modal.show {
    opacity: 1;
    visibility: visible;
}

.mayna-login-modal-card {
    width: 100%;
    max-width: 420px;
    padding: 32px 25px;
    background: #ffffff;
    border: 2px solid #ff7a00;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
}

.mayna-login-modal-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #ff7a00;
    color: #ffffff;
    font-size: 34px;
    font-weight: 800;
}

.mayna-login-modal-card h2 {
    margin: 0 0 10px;
    color: #222222;
    font-size: 25px;
}

.mayna-login-modal-card p {
    margin: 0 0 24px;
    color: #555555;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-line;
}

.mayna-login-modal-button {
    min-width: 120px;
    padding: 12px 24px;
    border: 0;
    border-radius: 10px;
    background: #ff7a00;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.mayna-login-modal-button:hover {
    opacity: 0.9;
}
</style>


</head>

<body>


<!-- NAVIGATION -->

<nav class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        MAYNA<span>.</span>
    </a>


    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="businesses.html">
            Explore
        </a>

        <a href="register.html">
            Register
        </a>

    </div>

</nav>



<!-- LOGIN -->

<main class="register-page">

    <section class="register-hero">

        <div class="register-label">
            BUSINESS OWNER
        </div>

        <h1>
            Welcome
            <br>
            back.
        </h1>

        <p>
            Sign in to manage your MAYNA
            business listing.
        </p>

    </section>



    <section class="register-container">

        <form
            id="loginForm"
            class="register-form"
        >

            <div class="form-section">

                <div class="form-heading">

                    <span class="form-number">
                        01
                    </span>

                    <h2>
                        Owner login
                    </h2>

                </div>


                <div class="form-grid">


                    <!-- EMAIL -->

                    <div class="form-group form-full">

                        <label for="email">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group form-full">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Your password"
                            required
                        >

                        <a
                            href="forgot-password.html"
                            class="forgot-password"
                        >
                            Forgot your password?
                        </a>

                    </div>


                </div>

            </div>



            <!-- SUBMIT -->

            <div class="submit-area">

                <button
                    type="submit"
                    class="submit-button"
                    id="loginButton"
                >
                    Login to my business →
                </button>

                <p>
                    Don't have a business account?
                    <a href="register.html">
                        Register your business
                    </a>
                </p>

            </div>


        </form>

    </section>

</main>

<!-- MAYNA OWNER LOGIN MODAL -->
<div
    class="mayna-login-modal"
    id="maynaLoginModal"
    aria-hidden="true"
>
    <div
        class="mayna-login-modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="maynaLoginModalTitle"
    >
        <div class="mayna-login-modal-icon">
            !
        </div>

        <h2 id="maynaLoginModalTitle">
            Login Failed
        </h2>

        <p id="maynaLoginModalMessage"></p>

        <button
            type="button"
            class="mayna-login-modal-button"
            id="maynaLoginModalButton"
        >
            OK
        </button>
    </div>
</div>

<script>

const maynaLoginModal =
    document.getElementById("maynaLoginModal");

const maynaLoginModalMessage =
    document.getElementById("maynaLoginModalMessage");

const maynaLoginModalButton =
    document.getElementById("maynaLoginModalButton");

function showMaynaLoginAlert(message) {
    return new Promise((resolve) => {

        maynaLoginModalMessage.textContent =
            message;

        maynaLoginModal.classList.add("show");

        maynaLoginModal.setAttribute(
            "aria-hidden",
            "false"
        );

        maynaLoginModalButton.onclick =
            function () {

                maynaLoginModal.classList.remove(
                    "show"
                );

                maynaLoginModal.setAttribute(
                    "aria-hidden",
                    "true"
                );

                resolve();
            };

        maynaLoginModalButton.focus();
    });
}

    const form =
        document.getElementById(
            "loginForm"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            try {

                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Logging in...";


                const response =
                    await fetch(
                        "/api/businesses/owner/login",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:
                                "include",

                            body:
                                JSON.stringify({

                                    email:
                                        email,

                                    password:
                                        password

                                })

                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Login failed."
                    );

                }


                window.location.href =
                    "dashboard.html";


            } catch (error) {

                console.error(
                    "Owner login error:",
                    error
                );


await showMaynaLoginAlert(
    "MAYNA login failed.\n\n" +
    error.message
);


            } finally {

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login to my business →";

            }

        }
    );

</script>


</body>

</html>
