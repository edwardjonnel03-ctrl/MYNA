<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Business Owner Login — MAYNA</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

    .forgot-password {
        display: inline-block;
        margin-top: 8px;
        color: #2563eb;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .forgot-password:hover {
        color: #1d4ed8;
        text-decoration: underline;
        transform: translateX(3px);
    }

</style>
```

</head>

<body>

```
<!-- NAVIGATION -->

<nav class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        MAYNA<span>.</span>
    </a>


    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="businesses.html">
            Explore
        </a>

        <a href="register.html">
            Register
        </a>

    </div>

</nav>



<!-- LOGIN -->

<main class="register-page">

    <section class="register-hero">

        <div class="register-label">
            BUSINESS OWNER
        </div>

        <h1>
            Welcome
            <br>
            back.
        </h1>

        <p>
            Sign in to manage your MAYNA
            business listing.
        </p>

    </section>



    <section class="register-container">

        <form
            id="loginForm"
            class="register-form"
        >

            <div class="form-section">

                <div class="form-heading">

                    <span class="form-number">
                        01
                    </span>

                    <h2>
                        Owner login
                    </h2>

                </div>


                <div class="form-grid">


                    <!-- EMAIL -->

                    <div class="form-group form-full">

                        <label for="email">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group form-full">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Your password"
                            required
                        >

                        <a
                            href="forgot-password.html"
                            class="forgot-password"
                        >
                            Forgot your password?
                        </a>

                    </div>


                </div>

            </div>



            <!-- SUBMIT -->

            <div class="submit-area">

                <button
                    type="submit"
                    class="submit-button"
                    id="loginButton"
                >
                    Login to my business →
                </button>

                <p>
                    Don't have a business account?
                    <a href="register.html">
                        Register your business
                    </a>
                </p>

            </div>


        </form>

    </section>

</main>



<!-- LOGIN SCRIPT -->

<script>

    const form =
        document.getElementById(
            "loginForm"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            try {

                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Logging in...";


                const response =
                    await fetch(
                        "/api/businesses/owner/login",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:
                                "include",

                            body:
                                JSON.stringify({

                                    email:
                                        email,

                                    password:
                                        password

                                })

                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Login failed."
                    );

                }


                window.location.href =
                    "dashboard.html";


            } catch (error) {

                console.error(
                    "Owner login error:",
                    error
                );


                alert(
                    "MAYNA login failed.\n\n" +
                    error.message
                );


            } finally {

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login to my business →";

            }

        }
    );

</script>
```

</body>

</html>
