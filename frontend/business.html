<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Business | MAYNA</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .profile-page {
            min-height: 100vh;
            padding: 110px 6% 70px;
            background: #f7f7f5;
        }

        .profile-container {
            max-width: 1100px;
            margin: auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #ff5a36;
            font-weight: 700;
            text-decoration: none;
        }

        .profile-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.08);
        }

        .profile-banner {
            background: #191919;
            padding: 55px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .profile-banner::after {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: #ff5a36;
            opacity: 0.15;
            right: -70px;
            top: -80px;
            pointer-events: none;
        }

        .profile-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 18px;
            margin-bottom: 25px;
            display: block;
            position: relative;
            z-index: 1;
        }

        .profile-logo {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            background: #ff5a36;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 10px 0 15px;
            padding: 7px 12px;
            border-radius: 20px;
            background: #fff1ec;
            color: #e84825;
            font-size: 14px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .profile-category {
            color: #ff8a70;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .profile-banner h1 {
            font-size: 46px;
            margin: 0 0 12px;
            position: relative;
            z-index: 1;
        }

        .profile-location {
            color: #cccccc;
            position: relative;
            z-index: 1;
        }

        .profile-content {
            padding: 45px;
        }

        .profile-section {
            margin-bottom: 40px;
        }

        .profile-section:last-child {
            margin-bottom: 0;
        }

        .profile-section h2 {
            margin-bottom: 15px;
            font-size: 25px;
        }

        .profile-description {
            color: #666666;
            line-height: 1.8;
        }


        .services {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px, 1fr)
        );
    gap: 15px;
}

.service-card {
    padding: 20px;
    background: #fff7f4;
    border: 1px solid #ffe0d7;
    border-radius: 14px;
}

.service-name {
    font-size: 18px;
    font-weight: 700;
    color: #222222;
    margin-bottom: 8px;
}

.service-price {
    color: #e84825;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
}

.service-description {
    color: #666666;
    line-height: 1.6;
}

        .work-gallery {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(200px, 1fr)
                );
            gap: 15px;
        }

    .work-gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 14px;
    display: block;
    cursor: pointer;
    transition:
        transform 0.2s ease,
        opacity 0.2s ease;
}

.work-gallery img:hover {
    transform: scale(1.03);
    opacity: 0.9;
}

.gallery-lightbox {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.92);
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.gallery-lightbox.active {
    display: flex;
}

.gallery-lightbox img {
    max-width: 95%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 10px;
}

.gallery-lightbox-close {
    position: absolute;
    top: 20px;
    right: 30px;
    color: white;
    font-size: 42px;
    font-weight: 700;
    cursor: pointer;
}

        .contact-grid {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 15px;
        }

        .contact-button {
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            background: #ff5a36;
            color: white;
            font-weight: 700;
        }

        .contact-button:hover {
            background: #e84825;
        }

        .new-rating {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 14px;
            border-radius: 20px;
            background: #fff1ec;
            color: #e84825;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .profile-message {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
        }

        @media (max-width: 700px) {

            .profile-page {
                padding: 90px 5% 50px;
            }

            .profile-banner {
                padding: 35px 25px;
            }

            .profile-banner h1 {
                font-size: 34px;
            }

            .profile-content {
                padding: 30px 25px;
            }

            .profile-image {
                height: 220px;
            }

            .work-gallery {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );
            }

            .work-gallery img {
                height: 150px;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

    <header class="navbar">

        <div class="logo">
            MAY<span>NA</span>
        </div>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="businesses.html">
                Explore
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="register.html">
                List your business
            </a>

        </nav>

    </header>


    <main class="profile-page">

        <div class="profile-container">

            <a
                href="businesses.html"
                class="back-link"
            >
                ← Back to businesses
            </a>


            <div id="profileContainer">

                <div class="profile-message">
                    Loading business...
                </div>

            </div>

        </div>

    </main>


    <script>

        const profileContainer =
            document.getElementById(
                "profileContainer"
            );


        function getInitials(name) {

            return name
                .split(" ")
                .filter(Boolean)
                .map(
                    word =>
                        word.charAt(0)
                )
                .join("")
                .substring(0, 2)
                .toUpperCase();

        }


        async function loadBusiness() {

            try {

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const id =
                    params.get("id");


                if (!id) {

                    profileContainer.innerHTML = `
                        <div class="profile-message">

                            <h2>
                                Business not found
                            </h2>

                            <p>
                                No business ID was provided.
                            </p>

                        </div>
                    `;

                    return;

                }


                const response =
                    await fetch(
                        "/api/businesses"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load businesses."
                    );

                }


                const result =
                    await response.json();


                const business =
                    result.businesses.find(
                        item =>
                            String(item.id) ===
                            String(id)
                    );


                if (!business) {

                    profileContainer.innerHTML = `
                        <div class="profile-message">

                            <h2>
                                Business not found
                            </h2>

                            <p>
                                This business could not be found.
                            </p>

                        </div>
                    `;

                    return;

                }


                const name =
                    business.businessName ||
                    "Business";


                const category =
                    business.category ||
                    "Business";


                const location =
                    business.town ||
                    business.location ||
                    "Namibia";


                const description =
                    business.description ||
                    "No description available yet.";


                const rating =
                    business.rating ||
                    null;


                const services =
    Array.isArray(
        business.services
    )
        ? business.services
            .filter(
                service =>
                    service &&
                    (
                        service.name ||
                        service.price ||
                        service.description
                    )
            )
        : [];


                const gallery =
                    Array.isArray(
                        business.gallery
                    )
                        ? business.gallery
                            .filter(Boolean)
                        : [];


                const initials =
                    getInitials(name);


                const phone =
                    business.phone ||
                    "";


                const whatsapp =
                    business.whatsapp ||
                    "";


                const email =
                    business.email ||
                    "";


                profileContainer.innerHTML = `

                    <div class="profile-card">

                        <div class="profile-banner">

                            ${
                                business.image
                                ? `
                                    <img
                                        src="${business.image}"
                                        class="profile-image"
                                        alt="${name}"
                                    >
                                `
                                : ""
                            }


                            <div class="profile-logo">
                                ${initials}
                            </div>


                            <div class="profile-category">
                                ${category}
                            </div>


                            ${
                                business.verified
                                ? `
                                    <div class="verified-badge">
                                        ✓ Verified Business
                                    </div>
                                `
                                : ""
                            }


                            <h1>
                                ${name}
                            </h1>


                            <div class="profile-location">
                                📍 ${location}, Namibia
                            </div>


                            ${
                                rating
                                ? `
                                    <div class="new-rating">
                                        ★ ${rating}
                                    </div>
                                `
                                : `
                                    <div class="new-rating">
                                        ★ New business
                                    </div>
                                `
                            }

                        </div>


                        <div class="profile-content">


                            <section class="profile-section">

                                <h2>
                                    About this business
                                </h2>

                                <p class="profile-description">
                                    ${description}
                                </p>

                            </section>


                            ${
    services.length
    ? `
        <section class="profile-section">

            <h2>
                Services & Prices
            </h2>

            <div class="services">

                ${services
                    .map(
                        service =>
                            `
                                <div class="service-card">

                                    <div class="service-name">
                                        ${service.name || "Service"}
                                    </div>

                                    ${
                                        service.price
                                        ? `
                                            <div class="service-price">
                                                ${service.price}
                                            </div>
                                        `
                                        : ""
                                    }

                                    ${
                                        service.description
                                        ? `
                                            <div class="service-description">
                                                ${service.description}
                                            </div>
                                        `
                                        : ""
                                    }

                                </div>
                            `
                    )
                    .join("")
                }

            </div>

        </section>
    `
        : ""
}


                            ${
                                gallery.length
                                ? `
                                    <section class="profile-section">

                                        <h2>
                                            Work Gallery
                                        </h2>

                                        <div class="work-gallery">

                                            ${gallery
                                                .map(
                                                    image =>
                                                        `
                                                            <img
                                                                src="${image}"
                                                                alt="${name} work"
                                                                class="gallery-work-image"
                                                                loading="lazy"
                                                            >
                                                        `
                                                )
                                                .join("")
                                            }

                                        </div>

                                    </section>
                                `
                                : ""
                            }


                            ${
                                phone ||
                                whatsapp ||
                                email
                                ? `
                                    <section class="profile-section">

                                        <h2>
                                            Contact
                                        </h2>

                                        <div class="contact-grid">

                                            ${
                                                phone
                                                ? `
                                                    <a
                                                        href="tel:${phone}"
                                                        class="contact-button"
                                                    >
                                                        Call
                                                    </a>
                                                `
                                                : ""
                                            }

                                            ${
                                                whatsapp
                                                ? `
                                                    <a
                                                        href="https://wa.me/${whatsapp.replace(/\D/g, "")}"
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        class="contact-button"
                                                    >
                                                        WhatsApp
                                                    </a>
                                                `
                                                : ""
                                            }

                                            ${
                                                email
                                                ? `
                                                    <a
                                                        href="mailto:${email}"
                                                        class="contact-button"
                                                    >
                                                        Email
                                                    </a>
                                                `
                                                : ""
                                            }

                                        </div>

                                    </section>
                                `
                                : ""
                            }

                        </div>

                    </div>
                `;


            } catch (error) {

                console.error(error);


                profileContainer.innerHTML = `
                    <div class="profile-message">

                        <h2>
                            Something went wrong
                        </h2>

                        <p>
                            ${error.message}
                        </p>

                    </div>
                `;

            }

        }

              loadBusiness();

    </script>


    <div
        id="galleryLightbox"
        class="gallery-lightbox"
    >
        <span
            id="galleryLightboxClose"
            class="gallery-lightbox-close"
        >
            &times;
        </span>

        <img
            id="galleryLightboxImage"
            src=""
            alt="Work gallery image"
        >
    </div>


    <script>

        const galleryLightbox =
            document.getElementById(
                "galleryLightbox"
            );

        const galleryLightboxImage =
            document.getElementById(
                "galleryLightboxImage"
            );

        const galleryLightboxClose =
            document.getElementById(
                "galleryLightboxClose"
            );


        document.addEventListener(
            "click",
            function (event) {

                const clickedImage =
                    event.target.closest(
                        ".gallery-work-image"
                    );

                if (!clickedImage) {
                    return;
                }

                galleryLightboxImage.src =
                    clickedImage.src;

                galleryLightbox.classList.add(
                    "active"
                );
            }
        );


        galleryLightboxClose.addEventListener(
            "click",
            function () {

                galleryLightbox.classList.remove(
                    "active"
                );

                galleryLightboxImage.src = "";
            }
        );


        galleryLightbox.addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    galleryLightbox
                ) {
                    galleryLightbox.classList.remove(
                        "active"
                    );

                    galleryLightboxImage.src = "";
                }
            }
        );


        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape" &&
                    galleryLightbox.classList.contains(
                        "active"
                    )
                ) {
                    galleryLightbox.classList.remove(
                        "active"
                    );

                    galleryLightboxImage.src = "";
                }
            }
        );

    </script>

</body>

</html>
