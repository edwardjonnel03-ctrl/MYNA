<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MAYNA - Reset Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="card">

    <h1>Create New Password</h1>

    <p>
        Choose a new password for your MAYNA
        business owner account.
    </p>


    <form id="resetForm">

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            minlength="6"
            placeholder="At least 6 characters"
            required
        >


        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            minlength="6"
            placeholder="Enter password again"
            required
        >


        <button
            type="submit"
            id="resetButton"
        >
            Reset Password
        </button>

    </form>


    <div id="message"></div>


    <a
        href="owner-login.html"
        class="back"
    >
        ← Back to Owner Login
    </a>

</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const params =
            new URLSearchParams(
                window.location.search
            );


        const token =
            params.get("token");


        const form =
            document.getElementById(
                "resetForm"
            );


        const password =
            document.getElementById(
                "password"
            );


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );


        const resetButton =
            document.getElementById(
                "resetButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        if (!token) {

            form.style.display =
                "none";

            message.textContent =
                "This password reset link is missing a token.";

            message.className =
                "error";

            message.style.display =
                "block";

            return;
        }


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                if (
                    password.value !==
                    confirmPassword.value
                ) {

                    message.textContent =
                        "The passwords do not match.";

                    message.className =
                        "error";

                    message.style.display =
                        "block";

                    return;
                }


                if (
                    password.value.length < 6
                ) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    message.className =
                        "error";

                    message.style.display =
                        "block";

                    return;
                }


                resetButton.disabled =
                    true;

                resetButton.textContent =
                    "Resetting...";


                try {

                    const response =
                        await fetch(
                            "/api/businesses/reset-password",
                            {

                                method:
                                    "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        token:
                                            token,

                                        password:
                                            password.value

                                    })
                            }
                        );


                    const result =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            result.message ||
                            "Password reset failed."
                        );
                    }


                    form.style.display =
                        "none";


                    message.textContent =
                        result.message ||
                        "Password reset successfully.";

                    message.className =
                        "success";

                    message.style.display =
                        "block";


                    setTimeout(
                        function () {

                            window.location.href =
                                "owner-login.html";

                        },
                        2500
                    );


                } catch (error) {

                    console.error(
                        "RESET PASSWORD ERROR:",
                        error
                    );


                    message.textContent =
                        error.message;

                    message.className =
                        "error";

                    message.style.display =
                        "block";


                } finally {

                    resetButton.disabled =
                        false;

                    resetButton.textContent =
                        "Reset Password";

                }

            }
        );

    }
);

</script>


</body>

</html>
